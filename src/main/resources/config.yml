# LocalFastCore 0.13.0
# Set operator.uuid after first startup using the server console: lfadmin setoperator <online-player>
operator:
  uuid: ""
# Existing player profiles are preserved; profile schema upgrades are additive.

# Economy defaults. Existing player balances are never overwritten.
economy:
  starting-balance: "0"
  currency-name: "монет"

# Player data is saved on the main thread at this interval (seconds).
autosave:
  interval-seconds: 60
scoreboard:
  enabled: true
  title: "§6§lLOCALFAST"
  footer: "§8play.localfast"
  refresh-ticks: 40

progression:
  points-per-level: 3
  max-stat: 1000
  mob-kill-xp: 10
  login-reward-xp: 25

daily:
  kills-required: 10
  xp-reward: 100
  money-reward: 50

quests:
  kills-required: 5
  rewards:
    any: 50
    zombie: 50
    skeleton: 60
    spider: 70
  # Configure each level-based quest independently.
  catalog:
    rookie_zombies: {kills: 10, reward: 100, money: 25}
    rookie_skeletons: {kills: 5, reward: 120}
    rookie_hunt: {kills: 20, reward: 150}
    adventurer_zombies: {kills: 30, reward: 300}
    adventurer_spiders: {kills: 20, reward: 350}
    adventurer_hunt: {kills: 40, reward: 400}
    veteran_skeletons: {kills: 50, reward: 700}
    veteran_spiders: {kills: 45, reward: 750}
    veteran_hunt: {kills: 80, reward: 900}
    elite_zombies: {kills: 100, reward: 1300}
    elite_skeletons: {kills: 80, reward: 1500}
    elite_hunt: {kills: 150, reward: 1800}
    legend_spiders: {kills: 150, reward: 2500}
    legend_skeletons: {kills: 150, reward: 2800}
    legend_hunt: {kills: 250, reward: 3500}

intelligence:
  # Legacy fallback values retained for existing config files.
  xp-bonus-per: 5
  xp-bonus-percent: 1

effects:
  level-up-title: true
  level-up-title-text: "§6УРОВЕНЬ ПОВЫШЕН!"
  level-up-subtitle: "§eНовый уровень!"

# RPG attribute formulas. Hard safety ceilings are enforced in code.
attributes:
  strength:
    points-per-bonus: 5
    damage-per-bonus: 1
    max-bonus: 10
  health:
    points-per-bonus: 5
    hp-per-bonus: 1
    max-bonus: 20
  agility:
    points-per-bonus: 5
    speed-percent-per-bonus: 1
    max-bonus-percent: 25
  intelligence:
    points-per-bonus: 5
    xp-bonus-percent-per-bonus: 1
    max-bonus-percent: 50

# Separate lobby/spawn world. Create or copy this world into worlds/ before use.
spawn-world: "spawn"

# Empty main-world uses the server default world; otherwise use its exact folder name.
main-world: ""

# RTP distance from the main world's safe-spawn point, in blocks.
rtp-min-radius: 500
rtp-max-radius: 5000
