name: NEXORA Server Runtime

on:
  push:
    branches:
      - nexora/compatibility-edition
    paths:
      - "src/**"
      - "pom.xml"
      - ".github/workflows/nexora-server.yml"
  pull_request:
    paths:
      - "src/**"
      - "pom.xml"
      - ".github/workflows/nexora-server.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify server runtime and tests
        run: mvn --batch-mode --no-transfer-progress clean verify
