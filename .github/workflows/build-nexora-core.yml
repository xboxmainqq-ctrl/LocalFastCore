name: Build NexoraCore

on:
  push:
    branches:
      - "nexora/**"
    paths:
      - "nexora-core/**"
      - ".github/workflows/build-nexora-core.yml"
  pull_request:
    paths:
      - "nexora-core/**"
      - ".github/workflows/build-nexora-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and verify NexoraCore
        run: mvn -f nexora-core/pom.xml --batch-mode --no-transfer-progress clean verify
      - name: Generate SHA-256 checksum
        run: sha256sum nexora-core/target/NexoraCore-*.jar > nexora-core/target/SHA256SUMS.txt
      - name: Upload NexoraCore JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexora-core-${{ github.sha }}
          path: |
            nexora-core/target/NexoraCore-*.jar
            nexora-core/target/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
