name: NEXORA Core

on:
  push:
    branches:
      - work/nexora-ai-foundation
      - work/nexora-streaming-optimization
      - nexora/compatibility-edition
    paths:
      - "server/nexora-core/**"
      - ".github/workflows/nexora-core.yml"
  pull_request:
    paths:
      - "server/nexora-core/**"
      - ".github/workflows/nexora-core.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress -f server/nexora-core/pom.xml clean verify
      - name: Upload runnable server package
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: nexora-core-${{ github.sha }}
          path: |
            server/nexora-core/target/nexora-core-*.jar
            server/nexora-core/target/lib/**
          if-no-files-found: error
          retention-days: 1
