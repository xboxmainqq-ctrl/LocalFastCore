name: NEXORA MOT Plugin

on:
  push:
    branches:
      - nexora/compatibility-edition
    paths:
      - "nukkit-mot-plugin/**"
      - ".github/workflows/nexora-mot-plugin.yml"
  pull_request:
    paths:
      - "nukkit-mot-plugin/**"
      - ".github/workflows/nexora-mot-plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and verify plugin
        working-directory: nukkit-mot-plugin
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: nexora-mot-plugin
          path: nukkit-mot-plugin/target/nexora-mot-plugin-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
