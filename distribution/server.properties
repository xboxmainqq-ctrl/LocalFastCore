# NEXORA Dedicated Server configuration
world.id=nexora_rpg
world.generator=overworld
# Seeded NEXORA terrain with nine original climate-selected surface biomes.
# New worlds also receive rivers, lakes, caves, ore veins, crystal geodes and biome trees.
world.seed=20261116
world.min-y=-64
world.max-y-exclusive=320
server.tick-rate=20

# Bedrock 1.26.60 test ingress (retail Microsoft/Xbox authentication required)
# McpeHost: signaling TCP 23472 + game UDP 23472.
bedrock.network.enabled=true
bedrock.bind-address=0.0.0.0
bedrock.port=23472
bedrock.ice-port=0
# Optional: public UDP endpoint(s), comma-separated, for hosts where outbound STUN is blocked.
# Example: bedrock.advertised-addresses=public-host.example:23472,203.0.113.10:23472
# McpeHost public endpoint supplied for this server:
bedrock.advertised-addresses=storm.MCPEhost.ru:23472
bedrock.identity-file=nethernet-identity.pem
