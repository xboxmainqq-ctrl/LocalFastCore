name: NEXORA Platform API

on:
  workflow_dispatch:
  push:
    branches:
      - nexora/compatibility-edition
    paths:
      - "nexora-modules/platform-api/**"
      - ".github/workflows/nexora-platform-api.yml"
  pull_request:
    paths:
      - "nexora-modules/platform-api/**"
      - ".github/workflows/nexora-platform-api.yml"

permissions:
  contents: read

jobs:
  test-platform-api:
    name: Test Platform API (Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexora-modules/platform-api
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: nexora-modules/platform-api/pom.xml

      - name: Run API tests
        run: mvn --batch-mode --no-transfer-progress test
