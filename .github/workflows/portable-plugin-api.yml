name: Portable Plugin API

on:
  push:
    paths:
      - "plugins/portable-api/**"
      - ".github/workflows/portable-plugin-api.yml"
  pull_request:
    paths:
      - "plugins/portable-api/**"
      - ".github/workflows/portable-plugin-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify portable API
        run: mvn -B -f plugins/portable-api/pom.xml verify
