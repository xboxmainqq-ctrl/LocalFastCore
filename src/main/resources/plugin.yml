name: LocalFastCore
main: ru.localfast.core.LocalFastCore
version: "0.4.0"
api: ["1.0.0"]
author: LocalFast
description: RPG progression, mob kill experience and quests for LocalFast Survival
commands:
  level:
    description: Показать уровень и опыт
    usage: "/level"
  stats:
    description: Показать характеристики
    usage: "/stats"
  addstat:
    description: Потратить очко характеристики
    usage: "/addstat <strength|health|agility|intelligence>"
  quest:
    description: Просмотр и выполнение заданий
    usage: "/quest [start|claim]"
  lfadmin:
    description: Команды администратора LocalFast
    usage: "/lfadmin xp <player> <amount>"
    permission: localfast.admin
permissions:
  localfast.admin:
    description: Управление RPG-прогрессом LocalFast
    default: op
