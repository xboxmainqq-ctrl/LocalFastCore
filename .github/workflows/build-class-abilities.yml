name: Build ClassAbilities 0.13.0
on:
  push:
    branches:
      - "work/0.12.0-staff-admin"
    paths:
      - "ClassAbilities/**"
      - ".github/workflows/build-class-abilities.yml"
  pull_request:
    paths:
      - "ClassAbilities/**"
      - ".github/workflows/build-class-abilities.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ClassAbilities
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and verify
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: class-abilities-0.13.0
          path: ClassAbilities/target/class-abilities-0.13.0.jar
          if-no-files-found: error
          retention-days: 14
