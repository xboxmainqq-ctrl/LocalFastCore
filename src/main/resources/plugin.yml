name: LocalFastCore
main: ru.localfast.core.LocalFastCore
version: "0.9.1"
api: ["1.0.0"]
author: LocalFast
description: LOCALFAST RPG progression, stats effects, mob kill experience and quests
commands:
  level:
    description: Показать уровень и опыт
    usage: "/level"
  stats:
    description: Показать характеристики
    usage: "/stats"
  addstat:
    description: Потратить одно или несколько очков характеристики
    usage: "/addstat <strength|health|agility|intelligence> [количество]"
  quest:
    description: Просмотр и выполнение заданий
    usage: "/quest [zombie|skeleton|spider|start|claim]"
  daily:
    description: Ежедневное задание
    usage: "/daily [start|claim]"
  lfmenu:
    description: Открыть RPG-меню характеристик
    usage: "/lfmenu"
  lfadmin:
    description: Команды администратора LocalFast
    usage: "/lfadmin xp <player> <amount>"
    permission: localfast.admin
permissions:
  localfast.admin:
    description: Управление RPG-прогрессом LocalFast
    default: op
