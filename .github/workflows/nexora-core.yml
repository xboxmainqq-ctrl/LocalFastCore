name: NEXORA Core

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "server/nexora-core/**"
      - ".github/workflows/nexora-core.yml"
  pull_request:
    paths:
      - "server/nexora-core/**"
      - ".github/workflows/nexora-core.yml"
  workflow_dispatch:

concurrency:
  group: nexora-core-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check out official Bedrock 1.26.60 GameData
        uses: actions/checkout@v4
        with:
          repository: PowerNukkitX/GameData
          ref: r/26_u6
          path: .gamedata
      - name: Install pinned GameData resources
        run: |
          mkdir -p server/nexora-core/src/main/resources/gamedata
          cp -R .gamedata/src/main/resources/gamedata/kaooot server/nexora-core/src/main/resources/gamedata/
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress -f server/nexora-core/pom.xml clean verify
      - name: Verify standalone JAR contents
        run: |
          test -f server/nexora-core/target/server.jar
          jar tf server/nexora-core/target/server.jar | grep -q "com/fasterxml/jackson/databind/ObjectMapper.class"
          jar tf server/nexora-core/target/server.jar | grep -q "org/cloudburstmc/netty/channel/nethernet/NetherNetChannelFactory.class"
          jar tf server/nexora-core/target/server.jar | grep -q "tel/schich/libdatachannel/PeerConnection.class"
          if jar tf server/nexora-core/target/server.jar | grep -q "dev/onvoid/webrtc/"; then
            echo "Legacy webrtc-java classes must not be packaged with the Cloudburst transport"
            exit 1
          fi
          unzip -p server/nexora-core/target/server.jar META-INF/MANIFEST.MF | grep -q "Main-Class: ru.nexora.NexoraServer"
      - name: Install Blender for generated-world inspection
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - name: Import generated NEXORA world and physics trace in Blender
        run: |
          blender --background --python tools/blender/import_nexora_preview.py -- server/nexora-core/target/blender-preview
          test -s server/nexora-core/target/blender-preview/nexora-preview.blend
      - name: Upload Blender world and physics preview
        uses: actions/upload-artifact@v4
        with:
          name: nexora-blender-preview-${{ github.sha }}
          path: |
            server/nexora-core/target/blender-preview/
            tools/blender/import_nexora_preview.py
          if-no-files-found: error
          retention-days: 7
      - name: Create checksum and optional official Ed25519 signature
        if: success()
        env:
          NEXORA_SIGNING_PRIVATE_KEY: ${{ secrets.NEXORA_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          jar="server/nexora-core/target/server.jar"
          sha256sum "$jar" > "$jar.sha256"
          if [[ -n "$NEXORA_SIGNING_PRIVATE_KEY" ]]; then
            public_key="server/nexora-core/src/main/resources/META-INF/nexora-signing-public-key.b64"
            if grep -qx "UNCONFIGURED" "$public_key"; then
              echo "::error::Pin the Ed25519 public key before signing releases."
              exit 1
            fi
            private_key="$RUNNER_TEMP/nexora-ed25519-private.pem"
            signature="$RUNNER_TEMP/nexora-server.jar.sig.bin"
            umask 077
            printf '%s\n' "$NEXORA_SIGNING_PRIVATE_KEY" > "$private_key"
            openssl pkeyutl -sign -rawin -inkey "$private_key" -in "$jar" -out "$signature"
            base64 -w0 "$signature" > "$jar.sig"
            printf '\n' >> "$jar.sig"
            rm -f "$private_key" "$signature"
            echo "NEXORA official build signature created."
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "::error::A release tag requires the NEXORA_SIGNING_PRIVATE_KEY Actions secret."
            exit 1
          else
            echo "::warning::Build is unsigned until signing key and pinned public key are configured."
          fi
      - name: Upload runnable server package and integrity files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-core-${{ github.sha }}
          path: |
            server/nexora-core/target/server.jar
            server/nexora-core/target/server.jar.sha256
            server/nexora-core/target/server.jar.sig
          if-no-files-found: error
          retention-days: 7
