name: NEXORA Luanti Engine Android Proof

on:
  push:
    branches:
      - nexora/compatibility-edition
    paths:
      - ".gitmodules"
      - "third_party/luanti"
      - ".github/workflows/nexora-luanti-android.yml"
  pull_request:
    paths:
      - ".gitmodules"
      - "third_party/luanti"
      - ".github/workflows/nexora-luanti-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-luanti-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-upstream-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out NEXORA and pinned Luanti source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;30.0.16248370
            cmake;3.22.1

      - name: Build Luanti Android debug APKs from pinned source
        working-directory: third_party/luanti/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload engine proof APKs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nexora-luanti-engine-proof-apks
          path: third_party/luanti/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
