name: Build LocalFastCore

on:
  workflow_dispatch:
  push:
    paths:
      - 'LocalFastCore_source_0.2.0.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source
        run: |
          mkdir extracted
          unzip LocalFastCore_source_0.2.0.zip -d extracted
          POM=$(find extracted -name pom.xml | head -n 1)
          echo "PROJECT_DIR=$(dirname "$POM")" >> "$GITHUB_ENV"

      - name: Build JAR
        run: cd "$PROJECT_DIR" && mvn -B clean package -DskipTests

      - uses: actions/upload-artifact@v4
        with:
          name: LocalFastCore-JAR
          path: '**/target/*.jar'
