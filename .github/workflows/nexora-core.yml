name: NEXORA Core

on:
  push:
    branches:
      - nexora/compatibility-edition
    paths:
      - "server/nexora-core/**"
      - ".github/workflows/nexora-core.yml"
  pull_request:
    paths:
      - "server/nexora-core/**"
      - ".github/workflows/nexora-core.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress -f server/nexora-core/pom.xml clean verify
