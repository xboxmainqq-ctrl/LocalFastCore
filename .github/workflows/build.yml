name: Build LocalFastCore

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract source
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP archive not found in repository root"
            ls -la
            exit 1
          fi
          echo "Using archive: $ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          echo "Archive contents:"
          find extracted -maxdepth 4 -type f | head -n 80
          POM=$(find extracted -name pom.xml -print -quit)
          if [ -z "$POM" ]; then
            echo "ERROR: pom.xml not found inside archive"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$POM")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Maven project: $PROJECT_DIR"

      - name: Build JAR
        run: mvn -B -f "$PROJECT_DIR/pom.xml" clean package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: LocalFastCore-JAR
          path: '${{ env.PROJECT_DIR }}/target/*.jar'
          if-no-files-found: error
