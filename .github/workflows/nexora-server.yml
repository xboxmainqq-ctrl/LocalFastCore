name: NEXORA Server Runtime

on:
  push:
    branches:
      - nexora/compatibility-edition
    paths:
      - "src/**"
      - "pom.xml"
      - ".github/workflows/nexora-server.yml"
  pull_request:
    paths:
      - "src/**"
      - "pom.xml"
      - ".github/workflows/nexora-server.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify server runtime and tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-server-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish executable server JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-core-server
          path: target/nexora-runtime-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 14
