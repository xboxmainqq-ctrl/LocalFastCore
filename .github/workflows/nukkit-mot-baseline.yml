name: Nukkit-MOT pinned baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-upstream-baseline:
    name: Build pinned Nukkit-MOT baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NUKKIT_MOT_REPOSITORY: https://github.com/MemoriesOfTime/Nukkit-MOT.git
      NUKKIT_MOT_REVISION: 3258c14baf71792c289519d623ef14e7cc02dd37
    steps:
      - name: Checkout NEXORA repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch pinned upstream source
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout "$NUKKIT_MOT_REPOSITORY" nukkit-mot
          git -C nukkit-mot checkout --detach "$NUKKIT_MOT_REVISION"
          actual="$(git -C nukkit-mot rev-parse HEAD)"
          test "$actual" = "$NUKKIT_MOT_REVISION"
          printf 'Nukkit-MOT revision: %s\n' "$actual" | tee nukkit-mot-build-info.txt
          git -C nukkit-mot remote -v | tee -a nukkit-mot-build-info.txt

      - name: Run upstream tests and package
        working-directory: nukkit-mot
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Assemble runtime dependencies
        working-directory: nukkit-mot
        run: |
          mvn --batch-mode --no-transfer-progress dependency:copy-dependencies \
            -DincludeScope=runtime \
            -DoutputDirectory=target/nexora-bundle/lib \
            -Dmdep.useBaseVersion=false
          mkdir -p target/nexora-bundle
          cp target/*.jar target/nexora-bundle/
          cp LICENSE target/nexora-bundle/ 2>/dev/null || true
          cp NOTICE target/nexora-bundle/ 2>/dev/null || true

      - name: Add build provenance and archive
        shell: bash
        run: |
          set -euo pipefail
          cp nukkit-mot-build-info.txt nukkit-mot/target/nexora-bundle/
          printf 'Built from upstream revision %s\n' "$NUKKIT_MOT_REVISION" > nukkit-mot/target/nexora-bundle/BUILD-INFO.txt
          cd nukkit-mot/target
          zip -qr "nukkit-mot-baseline-${NUKKIT_MOT_REVISION}.zip" nexora-bundle

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: nukkit-mot-baseline-${{ env.NUKKIT_MOT_REVISION }}
          path: nukkit-mot/target/nukkit-mot-baseline-${{ env.NUKKIT_MOT_REVISION }}.zip
          if-no-files-found: error
          retention-days: 14
