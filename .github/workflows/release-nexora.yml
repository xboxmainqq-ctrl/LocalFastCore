name: Sign and publish NEXORA release

on:
  push:
    tags:
      - "nexora-v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: nexora-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, and publish
    if: github.repository == 'aqaqpopa-del/LocalFastCore'
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and trusted branch ancestry
        id: release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^nexora-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected tag format nexora-vX.Y.Z; got: $TAG" >&2
            exit 1
          fi
          git fetch --no-tags origin "refs/heads/nexora/compatibility-edition:refs/remotes/origin/nexora/compatibility-edition"
          if ! git merge-base --is-ancestor "$COMMIT_SHA" "origin/nexora/compatibility-edition"; then
            echo "Release tag must point to a commit already contained in nexora/compatibility-edition." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#nexora-v}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: nexora-core/pom.xml

      - name: Set Maven project version from release tag
        run: >
          mvn -B -f nexora-core/pom.xml
          org.codehaus.mojo:versions-maven-plugin:2.18.0:set
          -DnewVersion="${{ steps.release.outputs.version }}"
          -DgenerateBackupPoms=false

      - name: Build and run tests
        run: mvn -f nexora-core/pom.xml --batch-mode --no-transfer-progress clean verify

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.0
        with:
          cosign-release: v2.6.0

      - name: Prepare release files and sign with Sigstore
        id: sign
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR="nexora-core/target/NexoraCore-${{ steps.release.outputs.version }}.jar"
          if [[ ! -f "$JAR" ]]; then
            echo "Expected build artifact not found: $JAR" >&2
            find nexora-core/target -maxdepth 1 -type f -print
            exit 1
          fi
          JAR_NAME="$(basename "$JAR")"
          cp "$JAR" dist/
          cd dist
          sha256sum "$JAR_NAME" > SHA256SUMS.txt

          cosign sign-blob --yes --bundle "$JAR_NAME.sigstore.json" "$JAR_NAME"
          cosign sign-blob --yes --bundle SHA256SUMS.txt.sigstore.json SHA256SUMS.txt

          IDENTITY="https://github.com/aqaqpopa-del/LocalFastCore/.github/workflows/release-nexora.yml@refs/tags/${{ steps.release.outputs.tag }}"
          ISSUER="https://token.actions.githubusercontent.com"
          cosign verify-blob --bundle "$JAR_NAME.sigstore.json" --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$JAR_NAME"
          cosign verify-blob --bundle SHA256SUMS.txt.sigstore.json --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

          echo "jar_name=$JAR_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish release assets
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            --title "NEXORA ${{ steps.release.outputs.version }}" \
            --generate-notes \
            "${{ steps.sign.outputs.jar_name }}" \
            SHA256SUMS.txt \
            "${{ steps.sign.outputs.jar_name }}.sigstore.json" \
            SHA256SUMS.txt.sigstore.json
