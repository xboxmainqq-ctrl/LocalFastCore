image: maven:3.9.9-eclipse-temurin-21

stages:
  - verify

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"

cache:
  key: "nexora-maven"
  paths:
    - .m2/repository/

nexora-core-verify:
  stage: verify
  script:
    - mvn $MAVEN_CLI_OPTS clean verify
    - test -f target/server.jar
    - jar tf target/server.jar | grep -q "com/fasterxml/jackson/databind/ObjectMapper.class"
    - unzip -p target/server.jar META-INF/MANIFEST.MF | grep -q "Main-Class: ru.nexora.NexoraServer"
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
    paths:
      - target/server.jar
      - target/surefire-reports/
