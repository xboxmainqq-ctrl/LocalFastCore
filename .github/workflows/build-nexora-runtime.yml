name: Build NEXORA Standalone Runtime

on:
  push:
    branches:
      - "nexora/**"
    paths:
      - "nexora-runtime/**"
      - ".github/workflows/build-nexora-runtime.yml"
  pull_request:
    paths:
      - "nexora-runtime/**"
      - ".github/workflows/build-nexora-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test standalone runtime
        run: mvn -f nexora-runtime/pom.xml --batch-mode --no-transfer-progress clean verify
