name: NEXORA AI Android Host

on:
  push:
    branches:
      - nexora-ai/android-server-prototype
    paths:
      - "nexora-ai-android/**"
      - "nexora-ai-web/**"
      - "nexora-ai-core/model-router/**"
      - ".github/workflows/nexora-ai-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bundle dashboard web assets
        run: |
          mkdir -p nexora-ai-android/app/src/main/assets/web
          cp -R nexora-ai-web/. nexora-ai-android/app/src/main/assets/web/

      - name: Build debug APK
        working-directory: nexora-ai-android
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-ai-host-debug
          path: nexora-ai-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
