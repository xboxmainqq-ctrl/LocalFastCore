name: LocalFastCore
main: ru.localfast.core.LocalFastCore
version: "0.54.0"
api: ["1.0.0"]
author: LocalFast
description: LocalFastCore 0.54.0 auction bidding and guild member management menus, player economy, market, guild and trade menus, Rift relic forge, pet collar and armor gear, active wolf, golem and snow pet abilities with cooldowns, pet leveling, pet XP and scalable companion bonuses, dungeon unlocks craftable Keeper relic equipment, forge legendary gear and collection, legendary forge effects and upgrades, clear-time records and speed leaderboard, Keeper final phase, second phase life siphon and trophy reward, hard-mode boss abilities and reinforcements, records and leaderboard, cooperative waves and bosses, RPG, economy and staff systems
commands:
  spawn:
    description: Телепорт на отдельный спавн
    usage: "/spawn"
  setspawn:
    description: Установить точку отдельного спавна
    usage: "/setspawn"
    permission: localfast.admin
  balance:
    description: Показать баланс монет
    usage: "/balance"
  pay:
    description: Перевести монеты игроку
    usage: "/pay <игрок> <сумма>"
  sethome:
    description: Сохранить точку дома
    usage: "/sethome"
  home:
    description: Телепортироваться домой
    usage: "/home"
  delhome:
    description: Удалить сохранённую точку дома
    usage: "/delhome"
  tpa:
    description: Запросить телепортацию к игроку
    usage: "/tpa <игрок>"
  tpaccept:
    description: Принять запрос телепортации
    usage: "/tpaccept"
  tpdeny:
    description: Отклонить запрос телепортации
    usage: "/tpdeny"
  rtp:
    description: Случайная безопасная телепортация в основной мир
    usage: "/rtp"
  top:
    description: Таблица лидеров RPG по уровню и опыту
    usage: "/top"
    aliases: [leaderboard]
  level:
    description: Показать уровень и опыт
    usage: "/level"
  stats:
    description: Показать характеристики
    usage: "/stats"
  addstat:
    description: Потратить одно или несколько очков характеристики
    usage: "/addstat <strength|health|agility|intelligence> [количество]"
  quest:
    description: Открыть уровневое меню заданий
    usage: "/quest"
  quests:
    description: Открыть уровневое меню заданий
    usage: "/quests"
  daily:
    description: Ежедневное задание
    usage: "/daily [start|claim]"
  weekly:
    description: Еженедельное RPG-испытание
    usage: "/weekly [start|claim]"
  questchain:
    description: Цепочка последовательных RPG-заданий
    usage: "/questchain [start|claim]"
  achievements:
    description: Открыть RPG-достижения
    usage: "/achievements"
    aliases: [achieve]
  menu:
    description: Главное меню игрока LocalFastCore
    usage: "/menu"
    aliases: [lfmenu]
  class:
    description: Выбрать или посмотреть класс персонажа
    usage: "/class [info]"
  ability:
    description: Использовать активную способность класса
    usage: "/ability"
  abilities:
    description: Открыть меню способностей класса
    usage: "/abilities"
  lfadmin:
    description: Операторская панель LocalFastCore
    usage: "/lfadmin"
  staff:
    description: Панель администрации и модерации
    usage: "/staff"
  trade:
    description: Безопасный перевод монет с подтверждением игрока
    usage: "/trade <игрок> <сумма>|accept|decline"
  market:
    description: Рынок предметов игроков
    usage: "/market <list|sell|buy|cancel>"
  auction:
    description: Аукцион с торгами и возвратом предметов победителю
    usage: "/auction <list|create|bid|claim>"
  guild:
    description: Создать гильдию, приглашать игроков и управлять составом
    usage: "/guild <create|invite|accept|info|list|leave|kick|role|transfer|disband>"
  forge:
    description: Кузница катакомб и постоянные улучшения экипировки
    usage: "/forge [info|weapon|armor]"
  pets:
    description: Меню питомцев-компаньонов
    usage: "/pets [ability]"
    aliases: [pet]
  rift:
    description: Кузница и коллекция Разлома Бездны
    usage: "/rift [info|forge|collection]"
  gear:
    description: Коллекция комплектов экипировки и бонусов
    usage: "/gear"
  dungeon:
    description: Прохождение подземелья и получение награды
    usage: "/dungeon [menu|info|start [easy|normal|hard]|difficulty <easy|normal|hard>|leave|claim|party|stats|top|speed|rift info|start|leave|claim]"
  boss:
    description: Охота на мирового босса
    usage: "/boss [menu|info|start|leave|claim]"
  world:
    description: Управление отдельными мирами LocalFast
    usage: "/world <list|create|load|tp|info>"
  worlds:
    description: Список миров сервера
    usage: "/worlds"
permissions:
  localfast.admin:
    description: Управление RPG-прогрессом LocalFast
    default: op
