name: NEXORA Server Runtime

on:
  push:
    branches:
      - nexora/compatibility-edition
    paths:
      - "src/**"
      - "pom.xml"
      - "distribution/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "pom.xml"
      - ".github/workflows/nexora-server.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # A fine-grained read-only token can be supplied if the runner's
          # automatic GITHUB_TOKEN cannot read this private repository.
          token: ${{ secrets.NEXORA_REPO_READ_TOKEN || github.token }}

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify server runtime and tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Assemble standalone server distribution
        if: success()
        run: |
          mkdir -p target/nexora-dedicated-server
          cp target/nexora-runtime-0.1.0-SNAPSHOT.jar target/nexora-dedicated-server/nexora-server.jar
          cp distribution/server.properties distribution/start.sh distribution/start.bat distribution/README.txt target/nexora-dedicated-server/
          cd target
          zip -r nexora-dedicated-server-preview.zip nexora-dedicated-server

      - name: Upload standalone server package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-dedicated-server-preview
          path: target/nexora-dedicated-server-preview.zip
          if-no-files-found: error
          retention-days: 14

      - name: Render deterministic world preview from generated chunks
        if: success()
        run: java -cp target/nexora-runtime-0.1.0-SNAPSHOT.jar ru.nexora.runtime.WorldPreviewRenderer 103 12 target/nexora-world-preview.png

      - name: Upload generated world preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-world-preview-seed-103-region-25x25
          path: target/nexora-world-preview.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-server-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish executable server JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-core-server
          path: target/nexora-runtime-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 14
